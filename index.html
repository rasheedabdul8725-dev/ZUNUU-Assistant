<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZUNUU Mic Test</title>
</head>
<body style="background:#17152d;color:white;text-align:center;font-family:Arial;padding:40px">
  <h1>💜 ZUNUU</h1>
  <h3>Microphone Test</h3>
  <button onclick="testMic()" style="padding:15px;font-size:18px">
    Test Microphone
  </button>
  <p id="status">Ready</p>

  <script>
    async function testMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        document.getElementById("status").textContent = "MIC WORKING ❤️";
        stream.getTracks().forEach(track => track.stop());
      } catch (e) {
        document.getElementById("status").textContent =
          "MIC ERROR: " + e.name;
      }
    }
  </script>
</body>
</html>
